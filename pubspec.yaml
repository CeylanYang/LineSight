name: linesight_flutter
description: A Flutter quality inspection app for factory production lines.
publish_to: none
version: 1.1.55+8079

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  cryptography: ^2.7.0
  crypto: ^3.0.7
  file_picker: ^10.3.10
  liquid_glass_renderer: 0.2.0-dev.4
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^10.3.4
  image_picker: ^1.2.4
  printing: ^5.15.1
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  camera: ^0.11.4
  nfc_manager: ^4.1.1
  flutter_patcher:
    hosted: https://pub.flutter-io.cn
    version: 0.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/reveal_logo.png
    - assets/fonts/NotoSansSC.ttf
    - assets/fonts/OFL-NotoSansSC.txt
    - assets/parts/
